  <!-- Umami analytics. data-domains pins collection to the live site, so
       `npm run dev` and `npm run preview` never reach the dataset.
       data-performance adds Core Web Vitals. Cookieless, no personal data -
       see src/lib/track.ts for the custom events. -->
  <script defer src="https://cloud.umami.is/script.js"
    data-website-id="8589972c-eba7-40e1-9140-09e83bfa17d2" data-domains="ciarka.pl"
    data-performance="true"></script>
  <!-- Styles the no-JS fallback inside #root (see src/lib/crawlerContent.ts).
       Inline because index.css only arrives with the JS bundle, and this block
       has to be presentable before that lands - it is real visible content,
       not a hidden SEO payload. -->
  <style>
    body {
      margin: 0;
      background: #070b14;
    }

    #static-fallback {
      max-width: 46rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      color: #c9d3e6;
      background: #070b14;
      font: 400 1rem/1.65 system-ui, sans-serif;
    }

    #static-fallback a {
      color: #7dd3fc;
    }

    #static-fallback h1 {
      font-size: 2rem;
      margin: 0 0 .5rem;
      color: #f1f5ff;
    }

    #static-fallback h2 {
      font-size: 1.25rem;
      margin: 2.5rem 0 .5rem;
      color: #f1f5ff;
    }

    #static-fallback h3 {
      font-size: 1rem;
      margin: 1.5rem 0 .25rem;
      color: #f1f5ff;
    }
  </style>
</head>

<body>
  <div id="root">__STATIC_CONTENT__</div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
