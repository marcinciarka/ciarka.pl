name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuilds hourly so the hero counters stay current. The stats are fetched
  # into the build rather than committed, which keeps bot commits out of the
  # public history.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Writes fresh numbers into public/stats.json for this build only. The
      # committed file is the fallback and the never-regress floor, so an API
      # outage ships the last committed numbers instead of failing the deploy.
      - name: Refresh stats.json
        continue-on-error: true
        env:
          # STATS_TOKEN is a user PAT (repo + read:user). Without it the search
          # API only sees this repo and the counts never move.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
